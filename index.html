<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Mortgage Calculator</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- ApexCharts -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<!-- jQuery for table management -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- DataTables CSS/JS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<style>
/* Tooltip icon styling */
.tooltip-icon { cursor: pointer; color: #0f766e; }

.dataTables_filter input {
  width: 150px !important;
  display: inline-block;
  font-size: 0.9em;
}
.dataTables_filter label { font-size: 0.9em; }

/* Table number color coding */
.principal { color: green; font-weight:bold; }
.extra-payment { color: blue; font-weight:bold; }
.interest { color: red; font-weight:bold; }
.pmi { color: purple; font-weight:bold; }
.balance { color: navy; }
.savings-positive { color: green; font-weight:bold; }
.savings-negative { color: red; font-weight:bold; }
</style>
</head>
<body class="bg-gray-50">

<header class="bg-teal-700 text-white p-4 text-center text-xl font-bold">
  Mortgage Calculator
</header>

<main class="container mx-auto p-4">
  <h2 class="text-lg font-semibold mb-4 text-center">Compare Two Mortgage Scenarios</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Scenario 1 -->
    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-3">Scenario 1</h3>
      <div class="space-y-4">
        <div class="flex items-center space-x-2">
          <label class="flex-1">Loan Amount ($)</label>
          <span class="tooltip-icon" title="The total loan amount you are borrowing. Example: 300,000">❓</span>
        </div>
        <input type="number" id="principal1" value="300000" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Interest Rate (%)</label>
          <span class="tooltip-icon" title="Annual interest rate of the loan. Example: 6%">❓</span>
        </div>
        <input type="number" step="0.01" id="interestRate1" value="6" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Term (Years)</label>
          <span class="tooltip-icon" title="Number of years for the loan. Example: 30">❓</span>
        </div>
        <input type="number" id="termYears1" value="30" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Extra Monthly Payment ($)</label>
          <span class="tooltip-icon" title="Extra payment you plan to pay each month. Example: 200">❓</span>
        </div>
        <input type="number" id="extraPayment1" value="0" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Extra Payments JSON</label>
          <span class="tooltip-icon" title='Specify extra payments for any month using JSON. Example: {"1":500,"12":1000}'>❓</span>
        </div>
        <textarea id="extraTable1" class="w-full border rounded px-2 py-1">{}</textarea>

        <div class="flex items-center space-x-2">
          <label class="flex-1">Property Tax ($/year)</label>
          <span class="tooltip-icon" title="Annual property taxes. Example: 3,600">❓</span>
        </div>
        <input type="number" id="propertyTax1" value="3600" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Home Insurance ($/year)</label>
          <span class="tooltip-icon" title="Annual home insurance. Example: 1,200">❓</span>
        </div>
        <input type="number" id="homeInsurance1" value="1200" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">PMI ($/year)</label>
          <span class="tooltip-icon" title="Private mortgage insurance if down payment <20%. Example: 0">❓</span>
        </div>
        <input type="number" id="pmi1" value="0" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Points (%)</label>
          <span class="tooltip-icon" title="Points paid upfront to lower interest rate. Example: 1">❓</span>
        </div>
        <input type="number" step="0.01" id="points1" value="0" class="w-full border rounded px-2 py-1">
      </div>
    </div>

    <!-- Scenario 2 -->
    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-3">Scenario 2</h3>
      <div class="space-y-4">
        <div class="flex items-center space-x-2">
          <label class="flex-1">Loan Amount ($)</label>
          <span class="tooltip-icon" title="The total loan amount you are borrowing. Example: 300,000">❓</span>
        </div>
        <input type="number" id="principal2" value="300000" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Interest Rate (%)</label>
          <span class="tooltip-icon" title="Annual interest rate of the loan. Example: 5.5%">❓</span>
        </div>
        <input type="number" step="0.01" id="interestRate2" value="5.5" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Term (Years)</label>
          <span class="tooltip-icon" title="Number of years for the loan. Example: 30">❓</span>
        </div>
        <input type="number" id="termYears2" value="30" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Extra Monthly Payment ($)</label>
          <span class="tooltip-icon" title="Extra payment you plan to pay each month. Example: 200">❓</span>
        </div>
        <input type="number" id="extraPayment2" value="0" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Extra Payments JSON</label>
          <span class="tooltip-icon" title='Specify extra payments for any month using JSON. Example: {"1":500,"12":1000}'>❓</span>
        </div>
        <textarea id="extraTable2" class="w-full border rounded px-2 py-1">{}</textarea>

        <div class="flex items-center space-x-2">
          <label class="flex-1">Property Tax ($/year)</label>
          <span class="tooltip-icon" title="Annual property taxes. Example: 3,600">❓</span>
        </div>
        <input type="number" id="propertyTax2" value="3600" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Home Insurance ($/year)</label>
          <span class="tooltip-icon" title="Annual home insurance. Example: 1,200">❓</span>
        </div>
        <input type="number" id="homeInsurance2" value="1200" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">PMI ($/year)</label>
          <span class="tooltip-icon" title="Private mortgage insurance if down payment <20%. Example: 0">❓</span>
        </div>
        <input type="number" id="pmi2" value="0" class="w-full border rounded px-2 py-1">

        <div class="flex items-center space-x-2">
          <label class="flex-1">Points (%)</label>
          <span class="tooltip-icon" title="Points paid upfront to lower interest rate. Example: 1">❓</span>
        </div>
        <input type="number" step="0.01" id="points2" value="0" class="w-full border rounded px-2 py-1">
      </div>
    </div>
  </div>

  <div class="mt-6">
    <h3 class="text-lg font-semibold mb-2">Mortgage Summary</h3>
    <div id="summary" class="bg-white p-4 rounded shadow overflow-x-auto"></div>
  </div>

  <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <h3 class="text-lg font-semibold mb-2">Principal vs Interest</h3>
      <div id="principalInterestChart"></div>
    </div>
    <div>
      <h3 class="text-lg font-semibold mb-2">Breakeven Chart</h3>
      <div id="breakevenChart"></div>
    </div>
  </div>

  <div class="mt-6">
    <h3 class="text-lg font-semibold mb-2">Total Savings</h3>
    <div id="totalSavingsChart"></div>
  </div>

  <div class="mt-6">
    <h3 class="text-lg font-semibold mb-2">Amortization Tables</h3>
    <div id="amortizationTables"></div>
  </div>
</main>

<script>
// Utility: format numbers with commas
function fmt(n){return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}

// Mortgage calculation
function calculateMortgage(principal, rate, years, extra, extraTable={}, tax=0, insurance=0, pmi=0, points=0){
  const monthlyRate = rate/12/100;
  const n = years*12;
  const pointsCost = principal*(points/100);
  const monthlyPayment = principal*monthlyRate/(1-Math.pow(1+monthlyRate,-n));
  let balance = principal;
  let schedule = [];
  const startDate = new Date();
  for(let i=1;i<=n;i++){
    const interest = balance*monthlyRate;
    let principalPayment = monthlyPayment-interest;
    let extraThis = extra + (extraTable[i]||0);
    if(balance<principalPayment+extraThis) principalPayment=balance;
    balance -= (principalPayment+extraThis);
    balance = Math.max(0,balance);
    const date = new Date(startDate); date.setMonth(date.getMonth()+i-1);
    schedule.push({
      month:i,
      date:date.toISOString().split('T')[0],
      principal:principalPayment,
      interest,
      extra:extraThis,
      tax:tax/12,
      insurance:insurance/12,
      pmi:pmi/12,
      total:principalPayment+interest+extraThis+tax/12+insurance/12+pmi/12,
      balance
    });
    if(balance<=0) break;
  }
  const cumulative = schedule.map((p,j)=>schedule.slice(0,j+1).reduce((s,p)=>s+p.total,0));
  const breakeven = cumulative.findIndex(c=>c>=pointsCost)+1||schedule.length;
  return {schedule,monthlyPayment,totalInterest:schedule.reduce((s,p)=>s+p.interest,0),totalPaid:cumulative[cumulative.length-1],pointsCost,breakeven,cumulative};
}

// Charts
let piChart, breakevenChart, savingsChart;

function update(){
  const parseJSON=(id)=>{try{return JSON.parse(document.getElementById(id).value)}catch(e){return {}}};
  const extra1=parseJSON('extraTable1'); const extra2=parseJSON('extraTable2');

  const inputs1=['principal1','interestRate1','termYears1','extraPayment1','propertyTax1','homeInsurance1','pmi1','points1'].map(id=>document.getElementById(id).value);
  const inputs2=['principal2','interestRate2','termYears2','extraPayment2','propertyTax2','homeInsurance2','pmi2','points2'].map(id=>document.getElementById(id).value);

  const m1 = calculateMortgage(parseFloat(inputs1[0]),parseFloat(inputs1[1]),parseInt(inputs1[2]),parseFloat(inputs1[3]),extra1,parseFloat(inputs1[4]),parseFloat(inputs1[5]),parseFloat(inputs1[6]),parseFloat(inputs1[7]));
  const m2 = calculateMortgage(parseFloat(inputs2[0]),parseFloat(inputs2[1]),parseInt(inputs2[2]),parseFloat(inputs2[3]),extra2,parseFloat(inputs2[4]),parseFloat(inputs2[5]),parseFloat(inputs2[6]),parseFloat(inputs2[7]));

  // Update summary
  document.getElementById('summary').innerHTML=`
    <table class="min-w-full border border-gray-200">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-2 py-1 border">Scenario</th><th class="px-2 py-1 border">Monthly Payment</th>
          <th class="px-2 py-1 border">Total Interest</th><th class="px-2 py-1 border">Total Paid</th>
          <th class="px-2 py-1 border">Points Cost</th><th class="px-2 py-1 border">Breakeven Month</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="px-2 py-1 border">1</td>
          <td class="px-2 py-1 border principal">$${fmt(m1.monthlyPayment)}</td>
          <td class="px-2 py-1 border interest">$${fmt(m1.totalInterest)}</td>
          <td class="px-2 py-1 border">$${fmt(m1.totalPaid)}</td>
          <td class="px-2 py-1 border pmi">$${fmt(m1.pointsCost)}</td>
          <td class="px-2 py-1 border">$${m1.breakeven}</td>
        </tr>
        <tr>
          <td class="px-2 py-1 border">2</td>
          <td class="px-2 py-1 border principal">$${fmt(m2.monthlyPayment)}</td>
          <td class="px-2 py-1 border interest">$${fmt(m2.totalInterest)}</td>
          <td class="px-2 py-1 border">$${fmt(m2.totalPaid)}</td>
          <td class="px-2 py-1 border pmi">$${fmt(m2.pointsCost)}</td>
          <td class="px-2 py-1 border">$${m2.breakeven}</td>
        </tr>
      </tbody>
    </table>`;

  const labels = m1.schedule.map(p=>p.month);

  // ApexCharts
  const optionsPI = {
    chart:{type:'area', height:300, toolbar:{show:true}},
    series:[
      {name:'Scenario1 Principal', data:m1.schedule.map(p=>p.principal)},
      {name:'Scenario1 Interest', data:m1.schedule.map(p=>p.interest)},
      {name:'Scenario2 Principal', data:m2.schedule.map(p=>p.principal)},
      {name:'Scenario2 Interest', data:m2.schedule.map(p=>p.interest)}
    ],
    xaxis:{categories:labels,title:{text:'Month'}},
    yaxis:{title:{text:'$'}},
    tooltip:{y:{formatter:val=>`$${fmt(val)}`}},
    stroke:{curve:'smooth'}
  };
  if(piChart) piChart.updateOptions(optionsPI); else piChart=new ApexCharts(document.querySelector("#principalInterestChart"),optionsPI),piChart.render();

  const optionsBreakeven = {
    chart:{type:'line',height:300},
    series:[
      {name:'Scenario1 Cumulative', data:m1.cumulative},
      {name:'Scenario2 Cumulative', data:m2.cumulative}
    ],
    xaxis:{categories:labels,title:{text:'Month'}},
    tooltip:{y:{formatter:val=>`$${fmt(val)}`}}
  };
  if(breakevenChart) breakevenChart.updateOptions(optionsBreakeven); else breakevenChart=new ApexCharts(document.querySelector("#breakevenChart"),optionsBreakeven),breakevenChart.render();

  const cumulativeSavings = m1.schedule.map((p,i)=>(m2.cumulative[i]||0)-(m1.cumulative[i]||0));
  const optionsSavings = {
    chart:{type:'line',height:300},
    series:[{name:'Cumulative Savings', data:cumulativeSavings}],
    xaxis:{categories:labels,title:{text:'Month'}},
    tooltip:{y:{formatter:val=>`$${fmt(val)}`}}
  };
  if(savingsChart) savingsChart.updateOptions(optionsSavings); else savingsChart=new ApexCharts(document.querySelector("#totalSavingsChart"),optionsSavings),savingsChart.render();

  // Amortization tables
  const amortDiv = document.getElementById('amortizationTables'); amortDiv.innerHTML='';
  [m1,m2].forEach((m,i)=>{
    const table = document.createElement('table');
    table.id=`table${i}`; table.className="display";
    const head = document.createElement('thead');
    head.innerHTML=`<tr>
      <th>Month</th><th>Date</th><th>Principal</th><th>Interest</th><th>Extra</th><th>Tax</th><th>Insurance</th><th>PMI</th><th>Total</th><th>Balance</th>
      <th>Savings vs Scenario ${i===0?2:1}</th>
    </tr>`; table.appendChild(head);
    const body=document.createElement('tbody');
    let cumTotal=0;
    m.schedule.forEach((p,idx)=>{
      cumTotal+=p.total;
      const savings=i===0 && m2.cumulative[idx]? m2.cumulative[idx]-cumTotal : 0;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${p.month}</td><td>${p.date}</td>
        <td class="principal">$${fmt(p.principal)}</td>
        <td class="interest">$${fmt(p.interest)}</td>
        <td class="extra-payment">$${fmt(p.extra)}</td>
        <td>$${fmt(p.tax)}</td>
        <td>$${fmt(p.insurance)}</td>
        <td class="pmi">$${fmt(p.pmi)}</td>
        <td>$${fmt(p.total)}</td>
        <td class="balance">$${fmt(p.balance)}</td>
        <td class="${savings>=0?'savings-positive':'savings-negative'}">$${fmt(savings)}</td>`;
      body.appendChild(tr);
    });
    table.appendChild(body);
    amortDiv.appendChild(document.createElement('h4')).textContent=`Scenario ${i+1} Amortization`;
    amortDiv.appendChild(table);
    $(`#table${i}`).DataTable({destroy:true,pageLength:10,responsive:true});
  });
}

// Event listeners
document.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',update));
document.addEventListener('DOMContentLoaded',update);
</script>
</body>
</html>
