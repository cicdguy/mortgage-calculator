<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage Dashboard - D3.js Version</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- D3.js -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<!-- jQuery for DataTables -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<style>
body.dark { background-color: #1f2937; color: #f9fafb; }
body.dark table, body.dark th, body.dark td { color: #f9fafb; border-color: #374151; }
header { transition: all 0.3s; }
.principal { color: green; font-weight:bold; }
.interest { color: red; font-weight:bold; }
.extra-payment { color: blue; font-weight:bold; }
.balance { color: navy; }
.savings-positive { color: green; font-weight:bold; }
.savings-negative { color: red; font-weight:bold; }
.tooltip { position: absolute; text-align:left; padding:8px; font:12px sans-serif; background: rgba(0,0,0,0.7); color:#fff; border-radius:4px; pointer-events:none; font-weight:bold; }
</style>
</head>
<body class="bg-gray-50">

<header class="bg-teal-700 text-white p-4 text-xl font-bold flex justify-between items-center">
  <span>Mortgage Dashboard</span>
  <button id="themeToggle" class="bg-white text-teal-700 px-3 py-1 rounded">Dark Mode</button>
</header>

<main class="container mx-auto p-4">
  <h2 class="text-lg font-semibold mb-4 text-center">Compare Two Mortgage Scenarios</h2>

  <!-- Inputs (simplified for demonstration) -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
      <h3 class="font-semibold mb-2">Scenario 1</h3>
      <label>Principal: <input type="number" id="p1" class="border rounded px-2 py-1" value="300000"></label><br>
      <label>Rate (%): <input type="number" id="r1" class="border rounded px-2 py-1" value="6.5"></label><br>
      <label>Years: <input type="number" id="y1" class="border rounded px-2 py-1" value="30"></label><br>
      <label>Points (%): <input type="number" id="points1" class="border rounded px-2 py-1" value="0"></label><br>
    </div>
    <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
      <h3 class="font-semibold mb-2">Scenario 2</h3>
      <label>Principal: <input type="number" id="p2" class="border rounded px-2 py-1" value="300000"></label><br>
      <label>Rate (%): <input type="number" id="r2" class="border rounded px-2 py-1" value="6.0"></label><br>
      <label>Years: <input type="number" id="y2" class="border rounded px-2 py-1" value="30"></label><br>
      <label>Points (%): <input type="number" id="points2" class="border rounded px-2 py-1" value="1"></label><br>
    </div>
  </div>

  <div class="mt-6">
    <h3 class="text-lg font-semibold mb-2">Principal vs Interest</h3>
    <div id="principalInterestChart" class="w-full h-[550px]"></div>
  </div>

  <div class="mt-6">
    <h3 class="text-lg font-semibold mb-2">Cumulative Savings / Breakeven</h3>
    <div id="cumulativeSavingsChart" class="w-full h-[550px]"></div>
  </div>

  <div class="mt-6">
    <h3 class="text-lg font-semibold mb-2">Amortization Tables</h3>
    <div id="amortizationTables" class="overflow-x-auto"></div>
  </div>
</main>

<script>
// Dark/Light toggle
document.getElementById('themeToggle').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  document.getElementById('themeToggle').textContent = document.body.classList.contains('dark') ? 'Light Mode' : 'Dark Mode';
  update();
});

// Tooltip div for D3
const tooltip = d3.select("body").append("div").attr("class","tooltip").style("opacity",0);

// Number formatting
function fmt(n){ return n.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}); }

// Mortgage calculation
function calculateMortgage(principal, rate, years, extra=0, extraTable={}, points=0){
  const monthlyRate = rate/12/100;
  const n = years*12;
  const pointsCost = principal*(points/100);
  const monthlyPayment = principal*monthlyRate/(1-Math.pow(1+monthlyRate,-n));
  let balance = principal;
  let schedule = [];
  for(let i=1;i<=n;i++){
    const interest = balance*monthlyRate;
    let principalPayment = monthlyPayment - interest;
    let extraThis = extra + (extraTable[i]||0);
    if(balance<principalPayment+extraThis) principalPayment = balance;
    balance = Math.max(0,balance-(principalPayment+extraThis));
    schedule.push({month:i, principal:principalPayment, interest, extra:extraThis, total:principalPayment+interest+extraThis, balance});
    if(balance<=0) break;
  }
  const cumulative = schedule.map((p,j)=>schedule.slice(0,j+1).reduce((s,p)=>s+p.total,0));
  return {schedule, cumulative, pointsCost};
}

// Main update function
function update(){
  const p1=parseFloat(document.getElementById('p1').value),
        r1=parseFloat(document.getElementById('r1').value),
        y1=parseFloat(document.getElementById('y1').value),
        points1=parseFloat(document.getElementById('points1').value);
  const p2=parseFloat(document.getElementById('p2').value),
        r2=parseFloat(document.getElementById('r2').value),
        y2=parseFloat(document.getElementById('y2').value),
        points2=parseFloat(document.getElementById('points2').value);

  const m1 = calculateMortgage(p1,r1,y1,0,{},points1);
  const m2 = calculateMortgage(p2,r2,y2,0,{},points2);

  drawPrincipalInterest(m1,m2);
  drawCumulativeSavings(m1,m2);
  drawAmortizationTables(m1,m2);
}

// Draw Principal vs Interest chart
function drawPrincipalInterest(m1,m2){
  const container = d3.select("#principalInterestChart");
  container.selectAll("*").remove();
  const width = container.node().clientWidth, height = container.node().clientHeight;
  const margin={top:50,right:60,bottom:50,left:60};

  const svg = container.append("svg").attr("width",width).attr("height",height);
  const x = d3.scaleLinear().domain([1,m1.schedule.length]).range([margin.left,width-margin.right]);
  const yMax = Math.max(d3.max(m1.schedule,d=>d.principal+d.interest),d3.max(m2.schedule,d=>d.principal+d.interest));
  const y = d3.scaleLinear().domain([0,yMax]).range([height-margin.bottom,margin.top]);

  svg.append("g").attr("transform",`translate(0,${height-margin.bottom})`).call(d3.axisBottom(x).ticks(12));
  svg.append("g").attr("transform",`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(10).tickFormat(d3.format(",")));

  const line = d3.line().x(d=>x(d.month)).y(d=>y(d.value)).curve(d3.curveMonotoneX);

  const principalData = m1.schedule.map(d=>({month:d.month,value:d.principal}));
  const interestData = m1.schedule.map(d=>({month:d.month,value:d.interest}));

  // Gradients
  const defs = svg.append("defs");
  defs.append("linearGradient")
      .attr("id","gradPrincipal").attr("x1","0").attr("y1","0").attr("x2","0").attr("y2","1")
      .selectAll("stop").data([{offset:"0%",color:"green",opacity:0.7},{offset:"100%",color:"green",opacity:0.1}])
      .enter().append("stop").attr("offset",d=>d.offset).attr("stop-color",d=>d.color).attr("stop-opacity",d=>d.opacity);

  defs.append("linearGradient")
      .attr("id","gradInterest").attr("x1","0").attr("y1","0").attr("x2","0").attr("y2","1")
      .selectAll("stop").data([{offset:"0%",color:"red",opacity:0.7},{offset:"100%",color:"red",opacity:0.1}])
      .enter().append("stop").attr("offset",d=>d.offset).attr("stop-color",d=>d.color).attr("stop-opacity",d=>d.opacity);

  // Principal line
  svg.append("path")
      .datum(principalData)
      .attr("fill","none").attr("stroke","url(#gradPrincipal)").attr("stroke-width",2)
      .transition().duration(1000)
      .attr("d", line);

  // Interest line
  svg.append("path")
      .datum(interestData)
      .attr("fill","none").attr("stroke","url(#gradInterest)").attr("stroke-width",2)
      .transition().duration(1000)
      .attr("d", line);

  // Circles with tooltip for principal
  svg.selectAll(".circleP")
      .data(principalData)
      .enter().append("circle")
      .attr("r",4).attr("fill","green")
      .attr("cx",d=>x(d.month)).attr("cy",d=>y(d.value))
      .on("mouseover",(event,d)=>{
          tooltip.transition().duration(200).style("opacity",1);
          tooltip.html(`Month ${d.month}<br>Principal: $${fmt(d.value)}`)
              .style("left",(event.pageX+10)+"px").style("top",(event.pageY-28)+"px");
      }).on("mouseout",()=>tooltip.transition().duration(500).style("opacity",0));

  // Circles with tooltip for interest
  svg.selectAll(".circleI")
      .data(interestData)
      .enter().append("circle")
      .attr("r",4).attr("fill","red")
      .attr("cx",d=>x(d.month)).attr("cy",d=>y(d.value))
      .on("mouseover",(event,d)=>{
          tooltip.transition().duration(200).style("opacity",1);
          tooltip.html(`Month ${d.month}<br>Interest: $${fmt(d.value)}`)
              .style("left",(event.pageX+10)+"px").style("top",(event.pageY-28)+"px");
      }).on("mouseout",()=>tooltip.transition().duration(500).style("opacity",0));
}

// Draw cumulative savings chart
function drawCumulativeSavings(m1,m2){
  const container = d3.select("#cumulativeSavingsChart");
  container.selectAll("*").remove();
  const width = container.node().clientWidth, height = container.node().clientHeight;
  const margin={top:50,right:60,bottom:50,left:60};

  const svg = container.append("svg").attr("width",width).attr("height",height);
  const x = d3.scaleLinear().domain([1,m1.schedule.length]).range([margin.left,width-margin.right]);
  const savingsData = m1.schedule.map((d,i)=> (m2.cumulative[i]||0)-(m1.cumulative[i]||0));
  const y = d3.scaleLinear().domain([0,d3.max(savingsData)]).range([height-margin.bottom,margin.top]);

  svg.append("g").attr("transform",`translate(0,${height-margin.bottom})`).call(d3.axisBottom(x).ticks(12));
  svg.append("g").attr("transform",`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(10).tickFormat(d3.format(",")));

  // Gradient
  const defs = svg.append("defs");
  defs.append("linearGradient").attr("id","gradSavings").attr("x1","0").attr("y1","0").attr("x2","0").attr("y2","1")
      .selectAll("stop").data([{offset:"0%",color:"blue",opacity:0.7},{offset:"100%",color:"blue",opacity:0.1}])
      .enter().append("stop").attr("offset",d=>d.offset).attr("stop-color",d=>d.color).attr("stop-opacity",d=>d.opacity);

  const line = d3.line().x((d,i)=>x(i+1)).y(d=>y(d)).curve(d3.curveMonotoneX);

  svg.append("path").datum(savingsData)
      .attr("fill","none").attr("stroke","url(#gradSavings)").attr("stroke-width",3)
      .transition().duration(1200)
      .attr("d",line);

  // Breakeven marker
  const breakevenMonth = savingsData.findIndex(d=>d>=0)+1;
  if(breakevenMonth>0){
    svg.append("line").attr("x1",x(breakevenMonth)).attr("x2",x(breakevenMonth))
      .attr("y1",y(0)).attr("y2",y(d3.max(savingsData)))
      .attr("stroke","#FF4560").attr("stroke-width",2).attr("stroke-dasharray","4,4");
    svg.append("text").attr("x",x(breakevenMonth)+5).attr("y",y(d3.max(savingsData))*0.05)
      .attr("fill","#FF4560").text(`Breakeven Month (${breakevenMonth})`);
  }

  svg.selectAll(".circleS")
      .data(savingsData)
      .enter().append("circle")
      .attr("r",4).attr("fill","blue")
      .attr("cx",(d,i)=>x(i+1)).attr("cy",d=>y(d))
      .on("mouseover",(event,d,i)=>{
          tooltip.transition().duration(200).style("opacity",1);
          tooltip.html(`Month ${i+1}<br>Cumulative Savings: $${fmt(d)}`)
              .style("left",(event.pageX+10)+"px").style("top",(event.pageY-28)+"px");
      }).on("mouseout",()=>tooltip.transition().duration(500).style("opacity",0));
}

// Draw amortization tables
function drawAmortizationTables(m1,m2){
  const container = document.getElementById("amortizationTables");
  container.innerHTML = "";

  function createTable(m, title){
    let html=`<h4 class="font-semibold mb-2 mt-4">${title}</h4>`;
    html+=`<table class="display nowrap" style="width:100%"><thead><tr>
      <th>Month</th><th>Principal</th><th>Interest</th><th>Extra</th><th>Total Payment</th><th>Balance</th></tr></thead><tbody>`;
    m.schedule.forEach(d=>{
      html+=`<tr>
        <td>${d.month}</td>
        <td class="principal">$${fmt(d.principal)}</td>
        <td class="interest">$${fmt(d.interest)}</td>
        <td class="extra-payment">$${fmt(d.extra)}</td>
        <td>$${fmt(d.total)}</td>
        <td class="balance">$${fmt(d.balance)}</td>
      </tr>`;
    });
    html+="</tbody></table>";
    container.innerHTML+=html;
  }

  createTable(m1,"Scenario 1");
  createTable(m2,"Scenario 2");

  $('table.display').DataTable({
    responsive:true,
    paging:true,
    scrollX:true,
    destroy:true
  });
}

document.querySelectorAll('input').forEach(el=>el.addEventListener('input',update));
document.addEventListener('DOMContentLoaded',update);
</script>

</body>
</html>
